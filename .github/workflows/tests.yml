# Nombre del workflow que aparecerá en la pestaña Actions de GitHub
name: QA Framework Tests

# Define los eventos que disparan este workflow
on:
  # Se dispara cuando hay un push a las ramas main o develop
  push:
    branches: [main, develop]
  # Se dispara cuando se abre o actualiza un Pull Request hacia main o develop
  pull_request:
    branches: [main, develop]
  # Permite ejecutar el workflow manualmente desde la interfaz de GitHub
  workflow_dispatch:

# Permisos necesarios para que peaceiris pueda escribir en la rama gh-pages
permissions:
  # Permiso para leer y escribir el contenido del repositorio
  contents: write
  # Permiso para desplegar en GitHub Pages
  pages: write
  # Permiso para generar el token OIDC que usa GitHub Pages
  id-token: write

# Define los trabajos o jobs que se van a ejecutar
jobs:
  # Nombre del job (puede ser cualquiera)
  test:
    # Máquina virtual donde correrá el job (Ubuntu más reciente)
    runs-on: ubuntu-latest
    # Tiempo máximo en minutos antes de que el job se cancele por timeout
    timeout-minutes: 20

    # Lista de pasos que se ejecutan en orden dentro del job
    steps:
      # Paso 1: Descarga el código del repositorio en el runner
      - name: Checkout código
        # Acción oficial de GitHub para hacer el checkout del repositorio
        uses: actions/checkout@v4

      # Paso 2: Configura Docker Buildx (necesario para builds avanzados)
      - name: Configurar Docker Buildx
        # Acción oficial de Docker para configurar Buildx
        uses: docker/setup-buildx-action@v3

      # Paso 3: Levanta el entorno con Docker Compose y corre la suite de Playwright
      - name: Correr suite completa (UI + API + DB)
        # Ejecuta el comando de Docker usando los dos archivos de compose
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up --build --exit-code-from framework

      # Paso 4: Sube los resultados de Allure como artefacto descargable
      - name: Subir resultados de Allure como artefacto
        # El 'if: always()' asegura que se ejecute incluso si los tests fallan
        if: always()
        # Acción oficial de GitHub para subir artefactos
        uses: actions/upload-artifact@v4
        with:
          # Nombre del artefacto que se generará
          name: allure-results
          # Ruta de los resultados en el repositorio
          path: framework/allure-results
          # Días que se conservará el artefacto antes de borrarse
          retention-days: 15

      # Paso 4.5: Hacer checkout de la rama gh-pages para recuperar el historial
      - name: Checkout rama gh-pages para historial
        # Se ejecuta incluso si los tests fallaron
        if: always()
        uses: actions/checkout@v4
        with:
          # Apunta a la rama gh-pages
          ref: gh-pages
          # La clona en una subcarpeta para no chocar con el código principal
          path: gh-pages-branch
          # Clona con historial completo para recuperar tendencias
          fetch-depth: 0
        # Si la rama gh-pages no existe aún, no falla el workflow
        continue-on-error: true

      # Paso 5: Generar reporte de Allure con historial (usando el CLI oficial)
      - name: Generar reporte Allure con historial
        # Se ejecuta incluso si los tests fallaron
        if: always()
        # Ejecuta el CLI de Allure descargado directamente de GitHub Releases
        run: |
          # Crea la carpeta de historial dentro de los resultados de Allure
          mkdir -p framework/allure-results/history
          # Si existe el historial de la ejecución anterior en la rama gh-pages, lo copia
          if [ -d "gh-pages-branch/history" ]; then
            cp -r gh-pages-branch/history/* framework/allure-results/history/
          fi
          # Descarga el CLI oficial de Allure (versión 2.30.0)
          wget https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz
          # Descomprime el archivo descargado
          tar -xzf allure-2.30.0.tgz
          # Genera el reporte limpio en la carpeta allure-report
          ./allure-2.30.0/bin/allure generate framework/allure-results -o allure-report --clean
          # Actualiza el historial dentro del reporte generado para la próxima ejecución
          mkdir -p allure-report/history
          cp -r framework/allure-results/history/* allure-report/history/ 2>/dev/null || true

      # Paso 6: Publicar el reporte en GitHub Pages
      - name: Publicar en GitHub Pages
        # Se ejecuta incluso si los tests fallaron
        if: always()
        # Acción de la comunidad que publica en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Token automático de GitHub para autenticarse
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Rama donde se publica el reporte
          publish_branch: gh-pages
          # Carpeta que se publica (el reporte de Allure generado)
          publish_dir: ./allure-report
          # No conserva archivos previos, solo publica los del reporte actual
          keep_files: false

      # Paso 7: Apaga y limpia los contenedores de Docker
      - name: Apagar entorno
        # Se ejecuta incluso si los tests fallaron
        if: always()
        # Comando para bajar los contenedores y borrar los volúmenes
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v